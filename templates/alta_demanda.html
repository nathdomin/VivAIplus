<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando - Viva+</title>
    <script src="/static/embed.js?v={{ versao_estaticos }}"></script>
    <link rel="stylesheet" href="/static/style.css?v={{ versao_estaticos }}">
</head>
<body>
    <div class="main-wrapper">
        <div class="text-section centralizada">
            <span class="highlight-tag">Fila de processamento</span>
            <h1>Só mais um instante 🤖</h1>
            <p>Nossa Inteligência Artificial está recebendo muitos currículos neste exato segundo.</p>
            <p>Para garantir a sua análise sem falhas, estamos aguardando a fila do servidor estabilizar.</p>

            <p class="contador">Reenviando automaticamente em: <strong id="contador">60</strong></p>

            <!-- Botão para o usuário apressar o envio -->
            <div class="acoes">
                <button class="btn-submit auto" onclick="forcarEnvio()">Tentar Novamente Agora</button>
            </div>

            <!-- Formulário invisível (usando textarea) -->
            <form id="formReenvio" action="/analisar" method="POST" style="display: none;">
                <textarea name="nome">{{ nome }}</textarea>
                <textarea name="arquivo_salvo">{{ arquivo_salvo }}</textarea>
                <textarea name="texto_curriculo">{{ texto_curriculo }}</textarea>
            </form>
        </div>
    </div>

    <script>
        let tempo = 60;
        const contador = document.getElementById('contador');
        const form = document.getElementById('formReenvio');

        // Função que força o envio imediato e para o relógio
        function forcarEnvio() {
            clearInterval(intervalo);
            contador.innerText = "Enviando...";
            form.submit();
        }

        // Relógio automático
        const intervalo = setInterval(() => {
            tempo--;
            contador.innerText = tempo;

            if(tempo <= 0) {
                forcarEnvio();
            }
        }, 1000);
    </script>
</body>
</html>
